<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalesSite — Redirecionando</title><meta name="robots" content="noindex">
<script>
const previous = (() => { try { return localStorage.getItem('view')?.split(' ')?.[1]; } catch (_) { return null; } })();
const target = previous && /^[0-5]$/.test(previous) ? './?produto=mVendidos-' + String(Number(previous) + 1).padStart(2, '0') : './';
location.replace(target);
</script></head><body><p>Esta página mudou. <a href="./">Abrir o SalesSite</a>.</p></body></html>
